services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banana_chat}
      POSTGRES_USER: ${POSTGRES_USER:-banana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banana_local_only}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 15}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 15}
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banana}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banana_local_only}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done; mc mb --ignore-existing local/banana-chat"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banana}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banana_local_only}
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
