map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server {
  listen 80;
  root /app/apps/api/public;
  index index.php;
  client_max_body_size 250m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-ancestors 'none'" always;
  location /ws { proxy_pass http://reverb:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; }
  location / { proxy_pass http://web:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ ^/(api|admin|livewire)(/|$) { try_files $uri $uri/ /index.php?$query_string; }
  location ~ ^/(css/filament|js/filament|storage)(/|$) { try_files $uri $uri/ /index.php?$query_string; }
  location ~ \.php$ { limit_req zone=api burst=60 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass api:9000; }
}
